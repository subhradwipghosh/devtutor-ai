<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevTutor AI — Developer Learning Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-light: rgba(99, 102, 241, 0.15);
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-card: #111827;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .logo-icon {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 1.1rem;
    box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
  }
  .title-group h1 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--text); }
  .title-group p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }
  .status-badge {
    display: flex; align-items: center; gap: 0.4rem;
    background: rgba(16, 185, 129, 0.12); color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.25);
    padding: 0.3rem 0.65rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
  }
  .status-dot { width: 7px; height: 7px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .msg { display: flex; flex-direction: column; animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }
  .bubble {
    display: inline-block;
    padding: 0.8rem 1.1rem;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    max-width: 88%;
    line-height: 1.5;
    white-space: pre-wrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
  }
  .msg.agent .bubble { border-bottom-left-radius: 4px; }
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; white-space: normal; box-shadow: none; }

  /* Interactive Example Prompt Chips */
  .chips-container {
    max-width: 860px; width: 100%; margin: 0 auto; padding: 0.5rem 1.5rem 0.2rem 1.5rem;
    display: flex; gap: 0.5rem; overflow-x: auto; flex-wrap: wrap;
  }
  .chip {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.45rem 0.85rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .chip:hover {
    background: var(--accent-light);
    color: #a5b4fc;
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  form {
    display: flex; gap: 0.6rem; padding: 0.9rem 1.5rem 1.2rem 1.5rem;
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  input {
    flex: 1; padding: 0.8rem 1.1rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 0.95rem; font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  button {
    padding: 0.8rem 1.4rem; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff; font-weight: 600; font-size: 0.95rem; font-family: inherit;
    cursor: pointer; transition: transform 0.15s, opacity 0.15s;
  }
  button:hover { opacity: 0.92; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  /* --- A2UI Component Renderer Styles --- */
  .a2card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #fff; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #a5b4fc; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
  .a2text.a2-caption { font-size: 0.8rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; margin-top: 0.5rem; border: 1px solid var(--border); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-icon">DT</div>
    <div class="title-group">
      <h1>DevTutor AI</h1>
      <p>Interactive Developer Learning Assistant</p>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    Agent Online
  </div>
</header>

<div id="log"></div>

<div class="chips-container">
  <button class="chip" onclick="sendPrompt('📚 List all learning topics')">📚 List all learning topics</button>
  <button class="chip" onclick="sendPrompt('⚡ Show C# & .NET Core Essentials')">⚡ C# & .NET Core Essentials</button>
  <button class="chip" onclick="sendPrompt('🎨 Generate a concept diagram for Docker')">🎨 Diagram Docker</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask DevTutor AI anything..." autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  if (typeof v.literalString === "string") return v.literalString;
  if (typeof v.value === "string") return v.value;
  if (typeof v.text === "string") return v.text;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const txt = boundStr(props.text);
      const mp4Match = txt.match(/https?:\/\/[^\s<>\)"']+\.mp4(?:\?[^\s<>\)"']*)?/i);
      const wrap = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) wrap.classList.add("a2-" + hint);
      else if (hint === "caption") wrap.classList.add("a2-caption");
      wrap.textContent = txt;

      if (mp4Match) {
        const cleanUrl = mp4Match[0].replace(/[)\]."'\s]+$/, '');
        const vid = el("video", "a2img");
        vid.src = cleanUrl;
        vid.controls = true;
        vid.autoplay = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.style.maxHeight = "360px";
        vid.style.width = "100%";
        vid.style.borderRadius = "8px";
        vid.style.marginTop = "8px";
        wrap.appendChild(vid);
      }
      return wrap;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      if (/\.mp4(?:\?.*)?$/i.test(src)) {
        const cleanUrl = src.replace(/[)\]."'\s]+$/, '');
        const vid = el("video", "a2img");
        vid.src = cleanUrl;
        vid.controls = true;
        vid.autoplay = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.style.maxHeight = "360px";
        vid.style.width = "100%";
        vid.style.borderRadius = "8px";
        return vid;
      }
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Video":
    case "Media": {
      const src = boundStr(props.url || props.src || props.videoUrl);
      if (!src) return null;
      const cleanUrl = src.replace(/[)\]."'\s]+$/, '');
      const vid = el("video", "a2img");
      vid.src = cleanUrl;
      vid.controls = true;
      vid.autoplay = true;
      vid.muted = true;
      vid.playsInline = true;
      vid.style.maxHeight = "360px";
      vid.style.width = "100%";
      vid.style.borderRadius = "8px";
      vid.style.marginTop = "8px";
      return vid;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function extractComponentsList(m) {
  if (!m || typeof m !== "object") return [];
  if (Array.isArray(m.components)) return m.components;
  if (m.surfaceUpdate && Array.isArray(m.surfaceUpdate.components)) return m.surfaceUpdate.components;
  if (m.beginRendering && Array.isArray(m.beginRendering.components)) return m.beginRendering.components;
  return [];
}

function extractRootId(m) {
  if (!m || typeof m !== "object") return null;
  if (typeof m.root === "string") return m.root;
  if (m.beginRendering && typeof m.beginRendering.root === "string") return m.beginRendering.root;
  if (m.surfaceUpdate && typeof m.surfaceUpdate.root === "string") return m.surfaceUpdate.root;
  return null;
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    const root = extractRootId(m);
    if (root) roots.push(root);
    const list = extractComponentsList(m);
    for (const c of list) {
      if (c && c.id && c.component) comps[c.id] = c.component;
    }
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      const type = spec ? Object.keys(spec)[0] : null;
      if (type) childIds(spec[type] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) { container.appendChild(node); drew = true; }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const list = extractComponentsList(m);
    for (const c of list) {
      if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
    }
  }
  return out.join("\n").trim();
}

function renderTextWithMedia(text, container) {
  if (!text) return;
  const mp4UrlRegex = /https?:\/\/[^\s<>\)"']+\.mp4(?:\?[^\s<>\)"']*)?/ig;
  const matches = text.match(mp4UrlRegex) || [];
  
  const div = document.createElement("div");
  div.style.whiteSpace = "pre-wrap";
  div.textContent = text;
  container.appendChild(div);

  matches.forEach(url => {
    const cleanUrl = url.replace(/[)\]."'\s]+$/, '');
    const vid = document.createElement("video");
    vid.src = cleanUrl;
    vid.controls = true;
    vid.autoplay = true;
    vid.muted = true;
    vid.playsInline = true;
    vid.className = "a2img";
    vid.style.maxHeight = "360px";
    vid.style.width = "100%";
    vid.style.borderRadius = "8px";
    vid.style.marginTop = "12px";
    container.appendChild(vid);
  });
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = [];
  const a2ui = [];

  for (const p of parts) {
    if (!p) continue;
    if (p.kind === "a2ui" && p.data) {
      a2ui.push(p.data);
    } else if (p.kind === "text" || (!p.kind && p.text)) {
      const txt = p.text || "";
      if (txt.includes("<a2ui-json>") && txt.includes("</a2ui-json>")) {
        try {
          const jsonStr = txt.split("<a2ui-json>")[1].split("</a2ui-json>")[0].trim();
          a2ui.push(JSON.parse(jsonStr));
        } catch(e) {}
      } else if (txt.trim().startsWith("{") && (txt.includes('"surfaceUpdate"') || txt.includes('"beginRendering"') || txt.includes('"surfaceId"'))) {
        try {
          a2ui.push(JSON.parse(txt.trim()));
        } catch(e) {
          texts.push(txt);
        }
      } else {
        texts.push(txt);
      }
    }
  }

  const textStr = texts.join("\n").trim();
  if (textStr) renderTextWithMedia(textStr, b);

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));

    // Fallback: check flattened A2UI text for any mp4 URLs
    const flat = flattenText(a2ui);
    if (flat) {
      const mp4Matches = flat.match(/https?:\/\/[^\s<>\)"']+\.mp4(?:\?[^\s<>\)"']*)?/ig) || [];
      mp4Matches.forEach(url => {
        const cleanUrl = url.replace(/[)\]."'\s]+$/, '');
        if (!b.querySelector(`video[src="${cleanUrl}"]`)) {
          const vid = el("video", "a2img");
          vid.src = cleanUrl;
          vid.controls = true;
          vid.autoplay = true;
          vid.muted = true;
          vid.playsInline = true;
          vid.style.maxHeight = "360px";
          vid.style.width = "100%";
          vid.style.borderRadius = "8px";
          vid.style.marginTop = "12px";
          b.appendChild(vid);
        }
      });
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
